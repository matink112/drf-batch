site_name: drf-batch
site_description: >-
  Batch-aware validation for Django REST Framework: collect every lookup once,
  validate the whole payload against memory, commit all-or-none.
# TODO(maintainer): set to the published docs URL and repository.
site_url: https://matink112.github.io/drf-batch/
repo_url: https://github.com/matink112/drf-batch
repo_name: drf-batch
edit_uri: edit/main/docs/
copyright: BSD-3-Clause

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guide:
      - Collection and cached fields: guide/collection.md
      - Async collection: guide/async.md
      - Permissions and scoping: guide/permissions.md
      - Hooks and responses: guide/hooks.md
      - Write path: guide/write-path.md
      - Cross-row conflicts: guide/conflicts.md
      - Retry policy: guide/retry.md
      - OpenAPI: guide/openapi.md
  - Reference:
      - How it works: reference/pipeline.md
      - Settings and view options: reference/settings.md
      - Error contract: reference/errors.md
      - API: reference/api.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Provenance: PROVENANCE.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
